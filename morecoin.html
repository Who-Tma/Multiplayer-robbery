<style>
  :root{
    --bg:#020402;
    --surface:rgba(6,20,10,0.72);
    --surface-2:rgba(10,32,16,0.85);
    --border:rgba(0,255,102,0.22);
    --green:#00FF66;
    --green-dim:#0AAE49;
    --green-glow:rgba(0,255,102,0.45);
    --text-1:#D9FFE4;
    --text-2:#5FA97A;
    --danger:#FF4D5E;
    --radius-lg:14px;
    --radius-md:10px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text-1);
    font-family:'Share Tech Mono', monospace;
    overflow-x:hidden;
  }

  canvas#matrixRain{
    position:fixed; inset:0; z-index:0;
    opacity:0.38;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:22px 16px calc(140px + var(--safe-b));
    position:relative;
    z-index:1;
  }

  /* ---------- Header / balance ---------- */
  .brand{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; letter-spacing:4px; font-weight:400;
    color:var(--green-dim); text-transform:uppercase;
    margin-bottom:16px;
  }
  .brand .dot{width:5px;height:5px;background:var(--green);box-shadow:0 0 8px var(--green);}

  .balance-card{
    background:var(--surface);
    backdrop-filter:blur(6px);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:24px 18px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px -12px var(--green-glow), inset 0 0 30px rgba(0,255,102,0.04);
  }
  .balance-card::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--green), transparent);
    animation:scan 3s linear infinite;
  }
  @keyframes scan{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(100%); }
  }

  .miner-box{ margin:0 auto 12px; height:74px; display:flex; align-items:center; justify-content:center; }

  .miner-btn{
    width:74px; height:74px;
    border-radius:14px;
    background:radial-gradient(circle at 35% 30%, rgba(0,255,102,0.22), rgba(0,20,10,0.9) 70%);
    border:1px solid var(--green);
    box-shadow:0 0 22px -4px var(--green-glow), inset 0 0 14px rgba(0,255,102,0.18);
    color:var(--green);
    font-family:'Share Tech Mono', monospace;
    font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase;
    line-height:1.3;
    cursor:pointer;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .miner-btn:active{ transform:scale(0.94); }

  .miner-active{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:74px; height:74px; border-radius:14px;
    border:1px solid var(--green);
    background:radial-gradient(circle at 35% 30%, rgba(0,255,102,0.18), rgba(0,20,10,0.9) 70%);
    box-shadow:0 0 22px -4px var(--green-glow), inset 0 0 14px rgba(0,255,102,0.18);
    justify-content:center;
    font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--green);
  }
  .miner-dot{
    width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:blink 1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .balance-label{
    font-size:11.5px; color:var(--text-2); letter-spacing:2px; text-transform:uppercase; margin-bottom:2px;

  .balance-number{
    font-family:'VT323', monospace;

    word-break:break-all;
  }
  .balance-sub{ font-size:11.5px; color:var(--text-2); margin-top:6px; letter-spacing:1px; }

  /* ---------- Store section ---------- */
  .section-title{
    font-size:12px; letter-spacing:2px; text-transform:uppercase;

  .section-title .arrow{ color:var(--green); }

  .store-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    backdrop-filter:blur(6px);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px;
    margin-bottom:10px;

  .store-icon{
    width:42px; height:42px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;

  #moreCoinBtn{

    padding:16px 20px;
    border-radius:12px;
    font-family:'Share Tech Mono', monospace;
    font-size:15px; font-weight:400; letter-spacing:2px; text-transform:uppercase;
    color:#00160A;
    background:var(--green);
    box-shadow:0 0 28px -6px var(--green-glow);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, opacity .2s ease;
    animation:pulse 2.4s ease-in-out infinite;
  }
  #moreCoinBtn:active{ transform:scale(0.97); }
  #moreCoinBtn:disabled{ animation:none; opacity:0.55; cursor:default; transform:none; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 22px -6px var(--green-glow); }
    50%{ box-shadow:0 0 34px -2px var(--green-glow); }
  }
  .btn-spinner{
    width:14px; height:14px; border-radius:50%;
    border:2.5px solid rgba(0,22,10,0.3); border-top-color:#00160A;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .cooldown-text{
    margin-top:8px; font-size:11px; color:var(--text-2); min-height:16px; letter-spacing:1px;
  }

  /* ---------- Floating reward particles ---------- */
  .float-layer{ position:fixed; inset:0; pointer-events:none; z-index:30; }
  .float-reward{
    position:absolute;
    font-family:'VT323', monospace;
    font-size:22px; color:var(--green);
    text-shadow:0 0 10px var(--green-glow);
    animation:floatUp 1.1s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0) scale(0.8); }
    15%{ opacity:1; transform:translateY(-10px) scale(1.05); }
    100%{ opacity:0; transform:translateY(-70px) scale(1); }
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-1); font-size:12.5px;
    padding:10px 16px; border-radius:10px;
    transition:transform .25s ease; z-index:40;
    white-space:nowrap; letter-spacing:0.5px;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast.error{ border-color:rgba(255,77,94,0.4); color:#FFB9BF; }

  /* ---------- Fallback ad overlay (iframe) ---------- */
  .ad-overlay{
    position:fixed; inset:0; z-index:100;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .ad-overlay.show{ opacity:1; pointer-events:auto; }

  .ad-overlay iframe{
    width:100%; height:100%;
    border:0; background:#050505;
  }

  .ad-overlay-topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top, 0px)) 14px 10px;
    z-index:2;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(2,4,2,0.85), transparent);
  }

  .ad-overlay-label{
    font-family:'Share Tech Mono', monospace;
    font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--text-2);
  }

  .ad-close-wrap{ pointer-events:auto; }

  .ad-timer-ring{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,20,10,0.85);
    border:1px solid var(--border);
    box-shadow:0 0 16px -4px var(--green-glow);
    position:relative;
  }

  .ad-timer-ring svg{ position:absolute; inset:0; transform:rotate(-90deg); }
  .ad-timer-ring circle{
    fill:none;
    stroke-width:2.5;
  }
  .ad-timer-ring .ring-bg{ stroke:rgba(0,255,102,0.15); }
  .ad-timer-ring .ring-fg{
    stroke:var(--green);
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear;
  }

  .ad-timer-num{
    font-family:'VT323', monospace;
    font-size:15px; color:var(--green);
    position:relative; z-index:1;
  }

  .ad-close-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--green);
    background:var(--green);
    color:#00160A;
    font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 0 20px -4px var(--green-glow);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .ad-close-btn:active{ transform:scale(0.92); }
  .ad-close-hint{
    position:absolute; bottom:0; left:0; right:0;
    text-align:center;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    font-size:11px; letter-spacing:1px; color:var(--text-2);
    background:linear-gradient(0deg, rgba(2,4,2,0.85), transparent);
    opacity:0; transition:opacity .3s ease;
    pointer-events:none;
  }
  .ad-close-hint.show{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    #moreCoinBtn, .miner-btn{ animation:none; }
    .balance-card::before, .miner-dot{ animation:none; }
  }
</style>

<script>
/* =========================================================================
   AD NETWORK INTEGRATION — RichAds (TelegramAdsController)
   CPC mode: triggerInterstitialBanner(true) skips the creative and sends
   the user straight to the offer link.

   showRewardedAd must return a Promise that:
     - resolves  -> interaction counted, reward should be granted
     - rejects   -> ad/offer failed to load or was closed early
   ========================================================================= */
function showRewardedAd(placementId) {
  return window.TelegramAdsController.triggerInterstitialBanner(true);
}

// ---------------------------------------------------------------------
// Matrix rain background
// ---------------------------------------------------------------------
(function matrixRain(){
  const canvas = document.getElementById('matrixRain');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cols, drops, fontSize = 16;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / fontSize);
    drops = new Array(cols).fill(0).map(() => Math.random() * -50);
  }
  window.addEventListener('resize', resize);
  resize();

  const chars = '01';

  function draw(){
    ctx.fillStyle = 'rgba(2,4,2,0.14)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < cols; i++){
      const char = chars[Math.floor(Math.random() * chars.length)];
      const y = drops[i] * fontSize;
      ctx.fillStyle = Math.random() > 0.94 ? '#D9FFE4' : '#00FF66';
      ctx.fillText(char, i * fontSize, y);
      if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  if (!reduceMotion){
    setInterval(draw, 55);
  }
})();

// ---------------------------------------------------------------------
// Per-account persistence (Telegram user id keyed, so a different
// Telegram account opening this mini app never sees someone else's
// locally-stored balance)
// ---------------------------------------------------------------------
function getTelegramUserId(){
  try{
    const u = window.Telegram && window.Telegram.WebApp &&
              window.Telegram.WebApp.initDataUnsafe &&
              window.Telegram.WebApp.initDataUnsafe.user;
    if (u && u.id) return String(u.id);
  }catch(e){}
  return 'guest'; // fallback when opened outside Telegram (local testing)
}

const STORAGE_PREFIX = 'morecoin_v1_';
const userId = getTelegramUserId();
const storageKey = STORAGE_PREFIX + userId;

function loadState(){
  try{
    const raw = localStorage.getItem(storageKey);
    if (raw){
      const data = JSON.parse(raw);
      return {
        balance: Number(data.balance) || 0,
        miningActive: !!data.miningActive
      };
    }
  }catch(e){}
  return { balance: 0, miningActive: false }; // fresh account starts at 0
}

function saveState(){
  try{
    localStorage.setItem(storageKey, JSON.stringify({ balance, miningActive }));
  }catch(e){}
}

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------
const initial = loadState();
let balance = initial.balance;
let miningActive = initial.miningActive;
let busy = false;
let miningInterval = null;

const balanceEl   = document.getElementById('balanceNumber');
const minerBox    = document.getElementById('minerBox');
const minerBtn    = document.getElementById('minerBtn');
const floatLayer  = document.getElementById('floatLayer');
const toastEl     = document.getElementById('toast');
const moreBtn     = document.getElementById('moreCoinBtn');
const btnLabel    = document.getElementById('btnLabel');
const cooldownEl  = document.getElementById('cooldownText');

function renderBalance(){
  const text = Number.isInteger(balance)
    ? balance.toLocaleString('en-US')
    : balance.toLocaleString('en-US', { minimumFractionDigits: 6, maximumFractionDigits: 6 });
  balanceEl.textContent = text;
}

function showToast(msg, isError){
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function spawnFloatingReward(amount, originEl){
  const rect = originEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-reward';
  el.textContent = '+' + amount;
  el.style.left = (rect.left + rect.width / 2 - 14) + 'px';
  el.style.top  = (rect.top - 6) + 'px';
  floatLayer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ---------------------------------------------------------------------
// Passive miner: ~0.000001 coins every 20ms once started
// ---------------------------------------------------------------------
function showMinerActiveUI(){
  minerBox.innerHTML = '<div class="miner-active"><span class="miner-dot"></span>Mining</div>';
}

function startMining(){
  if (miningInterval) return;
  miningActive = true;
  showMinerActiveUI();
  miningInterval = setInterval(() => {
    balance += 0.000001;
    renderBalance();
  }, 20);
  saveState();
}

if (miningActive){
  startMining();
} else {
  minerBtn.addEventListener('click', startMining);
}

// ---------------------------------------------------------------------
// Store redemption
// ---------------------------------------------------------------------
document.querySelectorAll('.store-item').forEach(item => {
  const cost = Number(item.dataset.cost);
  const name = item.dataset.name;
  const btn = item.querySelector('.redeem-btn');
  btn.addEventListener('click', () => {
    if (balance < cost){
      showToast('Not enough coins', true);
      return;
    }
    // TODO: call your backend here to actually fulfill/issue the reward
    // before deducting — this only updates the local balance.
    balance -= cost;
    renderBalance();
    saveState();
    showToast(name + ' redeemed', false);
  });
});

// ---------------------------------------------------------------------
// Fallback ad overlay (shown when RichAds errors or has no fill)
// Opens FALLBACK_AD_URL in an iframe, runs a 15s countdown top-right,
// then swaps the ring for a close (×) button. Closing grants the reward.
// ---------------------------------------------------------------------
const FALLBACK_AD_URL = 'https://www.profitableratecpmnetwork.com/ytjxef4i8a?key=3b0ff046d792dd2fee552a7fe74d7077';

const adOverlay   = document.getElementById('adOverlay');
const adIframe    = document.getElementById('adIframe');
const adTimerRing = document.getElementById('adTimerRing');
const adRingFg    = document.getElementById('adRingFg');
const adTimerNum  = document.getElementById('adTimerNum');
const adCloseBtn  = document.getElementById('adCloseBtn');
const adCloseHint = document.getElementById('adCloseHint');

const RING_R = 14.5;
const RING_CIRC = 2 * Math.PI * RING_R;
adRingFg.style.strokeDasharray = RING_CIRC.toFixed(2);

function openFallbackAd(){
  return new Promise((resolve) => {
    let seconds = 15;
    let closedByUser = false;

    adTimerNum.textContent = seconds;
    adRingFg.style.strokeDashoffset = '0';
    adTimerRing.style.display = 'flex';
    adCloseBtn.style.display = 'none';
    adCloseHint.classList.remove('show');
    adIframe.src = FALLBACK_AD_URL;
    adOverlay.classList.add('show');

    function finishAndGrant(){
      if (closedByUser) return;
      closedByUser = true;
      adOverlay.classList.remove('show');
      adIframe.src = 'about:blank';
      adCloseBtn.removeEventListener('click', finishAndGrant);
      resolve();
    }

    const timerInterval = setInterval(() => {
      seconds -= 1;
      if (seconds <= 0){
        clearInterval(timerInterval);
        adTimerRing.style.display = 'none';
        adCloseBtn.style.display = 'flex';
        adCloseHint.classList.add('show');
        adCloseBtn.addEventListener('click', finishAndGrant);
        return;
      }
      adTimerNum.textContent = seconds;
      const offset = RING_CIRC * (seconds / 15);
      adRingFg.style.strokeDashoffset = offset.toFixed(2);
    }, 1000);
  });
}

// ---------------------------------------------------------------------
// Bottom ad button — +1 coin per click, 5s cooldown
// ---------------------------------------------------------------------
moreBtn.addEventListener('click', () => {
  if (busy) return;
  busy = true;
  moreBtn.disabled = true;
  btnLabel.innerHTML = '<span class="btn-spinner"></span> Loading ad...';

  showRewardedAd('rewarded-main')
    .then(() => {
      balance += 1;
      renderBalance();
      spawnFloatingReward(1, moreBtn);
      saveState();
      showToast('+1 coin added', false);
    })
    .catch(() => {
      // Primary network errored or had no fill — fall back to the
      // direct-link network shown in-app via iframe.
      return openFallbackAd().then(() => {
        balance += 1;
        renderBalance();
        spawnFloatingReward(1, moreBtn);
        saveState();
        showToast('+1 coin added', false);
      });
    })
    .finally(() => {
      btnLabel.textContent = 'Watch ad · +1';
      startCooldown(5);
    });
});

function startCooldown(seconds){
  let s = seconds;
  const tick = () => {
    if (s <= 0){
      cooldownEl.textContent = '';
      moreBtn.disabled = false;
      busy = false;
      return;
    }
    cooldownEl.textContent = 'Try again in ' + s + 's';
    s -= 1;
    setTimeout(tick, 1000);
  };
  tick();
}

// ---------------------------------------------------------------------
// Autosave
// ---------------------------------------------------------------------
setInterval(saveState, 1000);
window.addEventListener('beforeunload', saveState);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });

renderBalance();
</script>
